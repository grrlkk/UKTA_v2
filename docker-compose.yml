services:
  mongo:
    image: mongo:7
    container_name: ukta_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --host localhost --quiet --eval \"db.adminCommand('ping').ok\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ukta_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64G
        reservations:
          memory: 16G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_API_URI: ${REACT_APP_API_URI}
    container_name: ukta_frontend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: ${FRONTEND_PORT:-3800}
      REACT_APP_API_URI: ${REACT_APP_API_URI}
    ports:
      - "${FRONTEND_PORT:-3800}:${FRONTEND_PORT:-3800}"
    depends_on:
      - backend

volumes:
  mongo_data:
